[package]
name = "shieldforge-antivirus"
version = "0.1.0"
description = "ShieldForge Antivirus - desktop shell (Tauri 2)"
authors = ["ShieldForge"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT OR Apache-2.0"
repository = "https://github.com/afzalpervaiz1474-cmd/saar"

[workspace]
members = ["crates/shieldforge-core"]

[lib]
name = "shieldforge_antivirus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The desktop shell layer. Everything security-related lives in shieldforge-core.
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shieldforge-core = { path = "crates/shieldforge-core", features = ["serde"] }

[features]
# Enables the ClamAV command-line adapter. Requires the `clamscan`/`clamdscan`
# binary to be installed; the adapter is inert until this feature is enabled.
clamav = []
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
